name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: generated-output
      cancel-in-progress: false
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Publish 3D profile to output
        run: |
          git fetch origin output:refs/remotes/origin/output
          git worktree add --detach "$RUNNER_TEMP/profile-output" origin/output
          mkdir -p "$RUNNER_TEMP/profile-output/profile-3d-contrib"
          rsync -a --delete profile-3d-contrib/ "$RUNNER_TEMP/profile-output/profile-3d-contrib/"
          git -C "$RUNNER_TEMP/profile-output" config user.name github-actions
          git -C "$RUNNER_TEMP/profile-output" config user.email github-actions@github.com
          git -C "$RUNNER_TEMP/profile-output" add profile-3d-contrib
          if ! git -C "$RUNNER_TEMP/profile-output" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/profile-output" commit -m "Update 3D profile"
            git -C "$RUNNER_TEMP/profile-output" push origin HEAD:output
          fi
