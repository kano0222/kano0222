name: Generate Snake

on:
  # run automatically every 12 hours
  schedule:
    - cron: "0 2 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: generated-output
      cancel-in-progress: false
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake/github-contribution-grid-snake.svg
            dist/snake/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      - name: Publish snake to output
        run: |
          git fetch origin output:refs/remotes/origin/output
          git worktree add --detach "$RUNNER_TEMP/profile-output" origin/output
          mkdir -p "$RUNNER_TEMP/profile-output/snake"
          rsync -a --delete dist/snake/ "$RUNNER_TEMP/profile-output/snake/"
          git -C "$RUNNER_TEMP/profile-output" config user.name github-actions
          git -C "$RUNNER_TEMP/profile-output" config user.email github-actions@github.com
          git -C "$RUNNER_TEMP/profile-output" add snake
          if ! git -C "$RUNNER_TEMP/profile-output" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/profile-output" commit -m "Update contribution snake"
            git -C "$RUNNER_TEMP/profile-output" push origin HEAD:output
          fi
